version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: leady-db
    mem_limit: 256M
    environment:
      POSTGRES_DB: leady
      POSTGRES_USER: leady
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leady"]
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: leady-redis-prod
    mem_limit: 64M
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: leady-api-prod
    mem_limit: 512M
    environment:
      DATABASE_URL: ${DATABASE_URL:?задай DATABASE_URL в .env}
      REDIS_URL: redis://redis:6379
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?задай SERVICE_API_TOKEN в .env}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:?задай AES_ENCRYPTION_KEY в .env}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET: ${YOOKASSA_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head;
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    restart: always

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: leady-bot-prod
    mem_limit: 256M
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL:?задай DATABASE_URL в .env}
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?задай SERVICE_API_TOKEN в .env}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:?задай AES_ENCRYPTION_KEY в .env}
      PROXY_LIST: ""
    command: python -m bot.main
    depends_on:
      - api
      - redis
    restart: always

volumes:
  pgdata:
